name: YouTube Shorts авто-жүктеу

on:
  schedule:
    - cron: "0 12 * * *" # күн сайын 12:00 UTC
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-ды алу
        uses: actions/checkout@v4

      - name: Python орнату
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Тәуелділіктерді орнату
        run: pip install google-auth google-api-python-client

      - name: Клиптерді жүктеу
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GAME_LINK: ${{ vars.GAME_LINK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/upload/upload_to_youtube.py

      - name: Жүктелген тізімді commit ету
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add automation/upload/uploaded.json
          git diff --staged --quiet || git commit -m "chore: update uploaded clips log"
          git push
